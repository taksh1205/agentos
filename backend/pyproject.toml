[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "agentos"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=2,<4", "sqlalchemy>=2,<3", "psycopg[binary]>=3,<4", "pgvector>=0.3,<1", "pypdf>=5,<7", "numpy>=2,<3", "scikit-learn>=1.5,<2", "httpx>=0.27,<1", "mcp>=1.20,<2", "python-multipart>=0.0.18", "openai>=3,<4", "anthropic>=2,<3", "PyJWT[crypto]>=2.10,<3"]
[project.optional-dependencies]
ml = ["torch>=2.6", "sentence-transformers>=3,<6"]
test = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.12"]
postgres = ["langgraph-checkpoint-postgres>=3,<4"]
telemetry = ["opentelemetry-sdk>=1.30,<2", "opentelemetry-exporter-otlp-proto-http>=1.30,<2"]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
